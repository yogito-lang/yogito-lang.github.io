<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Üçler Ortaokulu Öğrenci Sitesi</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom,#fff9c4,#ffe082);
}

header{
  background:#ffeb3b;
  padding:25px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
  box-shadow:0 4px 8px rgba(0,0,0,.2);
}

main{
  max-width:600px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}

input,button{
  padding:10px;
  margin:6px;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  background:#ffeb3b;
  border:none;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#ffe000;
}

.post{
  background:#fffde7;
  border:1px solid #ffeb3b;
  padding:10px;
  border-radius:10px;
  margin:15px 0;
}

img{
  max-width:100%;
  border-radius:10px;
  margin-top:10px;
}

/* gizli alanlar */
#site,#adminPanel,#adminLogin{
  display:none;
}

/* gizli admin butonu */
#adminToggle{
  position:fixed;
  bottom:10px;
  right:10px;
  font-size:22px;
  background:#000;
  color:#fff;
  width:40px;
  height:40px;
  border-radius:50%;
}
</style>
</head>

<body>

<header>Üçler Ortaokulu Öğrenci Sitesi</header>

<main>

<!-- CAPTCHA -->
<div id="captchaBox">
  <h3>Robot Doğrulama</h3>
  <p>Kodu yaz:</p>
  <div id="captchaCode" style="font-size:22px;color:red;font-weight:bold;"></div>
  <input id="captchaInput" placeholder="Kodu gir">
  <button onclick="checkCaptcha()">Doğrula</button>
  <p id="captchaMsg"></p>
</div>

<!-- SİTE -->
<div id="site">
  <h2>Paylaşımlar</h2>
  <div id="posts"></div>
</div>

<!-- ADMIN -->
<div id="adminLogin">
  <h3>Admin Girişi</h3>
  <input id="adminUser" placeholder="Kullanıcı">
  <input id="adminPass" type="password" placeholder="Şifre">
  <button onclick="adminLogin()">Giriş</button>
</div>

<div id="adminPanel">
  <h3>Yeni Paylaşım</h3>
  <input id="postText" placeholder="Metin"><br>
  <input id="postImg" placeholder="Resim URL"><br>
  <button onclick="addPost()">Paylaş</button>
</div>

</main>

<button id="adminToggle" onclick="toggleAdmin()">⚙️</button>

<script>
/* CAPTCHA */
let captcha = Math.floor(1000 + Math.random()*9000);
document.getElementById("captchaCode").innerText = captcha;

function checkCaptcha(){
  if(document.getElementById("captchaInput").value == captcha){
    document.getElementById("captchaBox").style.display="none";
    document.getElementById("site").style.display="block";
    loadPosts();
  }else{
    document.getElementById("captchaMsg").innerText="Yanlış len tekrar dene";
  }
}

/* LOCAL STORAGE */
function loadPosts(){
  let posts = JSON.parse(localStorage.getItem("posts") || "[]");
  let area = document.getElementById("posts");
  area.innerHTML="";
  posts.forEach(p=>{
    let d=document.createElement("div");
    d.className="post";
    d.innerHTML=`<p>${p.text}</p>`+(p.img?`<img src="${p.img}">`:"");
    area.appendChild(d);
  });
}

function addPost(){
  let text=document.getElementById("postText").value;
  let img=document.getElementById("postImg").value;
  let posts=JSON.parse(localStorage.getItem("posts")||"[]");
  posts.unshift({text, img});
  localStorage.setItem("posts",JSON.stringify(posts));
  loadPosts();
  document.getElementById("postText").value="";
  document.getElementById("postImg").value="";
}

/* ADMIN */
const ADMIN_USER="admin";
const ADMIN_PASS="1234";

function toggleAdmin(){
  let a=document.getElementById("adminLogin");
  a.style.display = a.style.display=="block"?"none":"block";
}

function adminLogin(){
  if(
    document.getElementById("adminUser").value===ADMIN_USER &&
    document.getElementById("adminPass").value===ADMIN_PASS
  ){
    document.getElementById("adminPanel").style.display="block";
    alert("Admin açıldı");
  }else{
    alert("Yanlış giriş");
  }
}
</script>

</body>
</html>
